<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  /* Una columna tipo app: estación arriba, días en fila, un día a la vista; compra en su propia pestaña */
  --bg: #f6f5f1;
  --surface: #ffffff;
  --ink: #1c211e;
  --muted: #6b726e;
  --line: #e6e7e2;
  --accent: #3f7d4e;
  --accent-soft: #e6f0e7;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(28, 33, 30, .04), 0 6px 20px rgba(28, 33, 30, .05);
  color-scheme: light;
}
:root[data-season="primavera"] { --accent: #3f7d4e; --accent-soft: #e6f0e7; }
:root[data-season="verano"] { --accent: #bf4f2e; --accent-soft: #f8e7df; }
:root[data-season="otono"] { --accent: #a3620f; --accent-soft: #f4eadb; }
:root[data-season="invierno"] { --accent: #2f6390; --accent-soft: #e3ebf3; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121614; --surface: #1b201d; --ink: #ecefec; --muted: #9ea7a2; --line: #2b322e; --shadow: none; color-scheme: dark; }
  :root:not([data-theme="light"])[data-season="primavera"] { --accent: #86c595; --accent-soft: #213428; }
  :root:not([data-theme="light"])[data-season="verano"] { --accent: #f0936f; --accent-soft: #3d251d; }
  :root:not([data-theme="light"])[data-season="otono"] { --accent: #e4ab5a; --accent-soft: #3a2c1b; }
  :root:not([data-theme="light"])[data-season="invierno"] { --accent: #86b6e2; --accent-soft: #1d2e40; }
}
:root[data-theme="dark"] { --bg: #121614; --surface: #1b201d; --ink: #ecefec; --muted: #9ea7a2; --line: #2b322e; --shadow: none; color-scheme: dark; }
:root[data-theme="dark"][data-season="primavera"] { --accent: #86c595; --accent-soft: #213428; }
:root[data-theme="dark"][data-season="verano"] { --accent: #f0936f; --accent-soft: #3d251d; }
:root[data-theme="dark"][data-season="otono"] { --accent: #e4ab5a; --accent-soft: #3a2c1b; }
:root[data-theme="dark"][data-season="invierno"] { --accent: #86b6e2; --accent-soft: #1d2e40; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 720px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 18px; }

/* Cabecera */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--display); font-weight: 600; font-size: 1.15rem; letter-spacing: -.01em; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.date-pill { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .88rem; font-weight: 500; }
.date-pill input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.icon-btn svg { width: 18px; height: 18px; }
.today-btn { padding: 7px 12px; border-radius: 999px; background: var(--accent); color: var(--surface); border: 0; font-size: .85rem; font-weight: 600; }
.today-btn[hidden] { display: none; }

/* Estación */
.hero { padding: 4px 2px 0; }
.hero .kicker { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 9vw, 3.2rem); line-height: 1; margin: 6px 0 8px; letter-spacing: -.02em; }
.hero p { margin: 0; color: var(--muted); max-width: 52ch; font-size: .95rem; }

/* Controles */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 8px 6px; font-weight: 600; font-size: .9rem; color: var(--muted); position: relative; white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
.seg .dot { position: absolute; top: 3px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.seg button[aria-selected="true"] .dot { background: var(--surface); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-btn { border: 1px solid transparent; background: transparent; border-radius: 14px; padding: 8px 0 7px; display: grid; justify-items: center; gap: 3px; color: var(--muted); }
.day-btn .d { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.day-btn .n { font-family: var(--display); font-size: 1.25rem; color: var(--ink); line-height: 1.1; }
.day-btn .tr { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.day-btn .tr.on { background: var(--accent); }
.day-btn[aria-selected="true"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); color: var(--accent); }
.day-btn.is-today .n { color: var(--accent); }

/* Día */
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 0 2px; }
.day-head h2 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: -.01em; }
.day-head .meta { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-family: var(--body); font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 8px; vertical-align: middle; }
.tag.rest { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.meals { display: grid; gap: 10px; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 4px; text-align: left; width: 100%; }
button.meal { cursor: pointer; transition: border-color .15s; }
button.meal:hover { border-color: var(--accent); }
.meal .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.meal .lbl { font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.meal .go { font-size: .78rem; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.meal .t { font-family: var(--display); font-size: 1.12rem; line-height: 1.25; font-weight: 400; }
.meal .ing { font-size: .86rem; color: var(--muted); line-height: 1.4; }

/* Compra */
.shop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.shop h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; }
.shop .sub { color: var(--muted); font-size: .88rem; margin-top: 2px; }
.shop h3 { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin: 18px 0 6px; }
.shop ul { list-style: none; padding: 0; margin: 0; }
.shop li { border-bottom: 1px solid var(--line); }
.shop li:last-child { border-bottom: 0; }
.shop label { display: flex; gap: 12px; align-items: center; padding: 9px 0; cursor: pointer; font-size: .95rem; }
.shop input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.shop .q { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .9rem; }
.shop input:checked ~ span { color: var(--muted); text-decoration: line-through; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.btn { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .9rem; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.toast { font-size: .85rem; color: var(--accent); min-height: 1.2em; margin-top: 8px; }

/* Hojas (receta y ajustes) */
.sheet { position: fixed; inset: 0; background: rgba(15, 18, 16, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet[hidden] { display: none; }
.panel { position: relative; background: var(--surface); width: min(680px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 12px 22px calc(28px + env(safe-area-inset-bottom)); }
.panel::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
@media (min-width: 760px) { .sheet { align-items: center; padding: 24px; } .panel { border-radius: 22px; max-height: 88vh; padding-top: 22px; } .panel::before { display: none; } }
.close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--bg); font-size: .95rem; }
.panel .kicker { font-size: .75rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; line-height: 1.15; margin: 6px 44px 10px 0; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.panel h3 { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 22px 0 8px; }
.ing-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.ing-list li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.ing-list li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hint { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 14px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; line-height: 1.5; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .85rem; display: grid; place-items: center; }
.notes { margin-top: 20px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: .86rem; display: grid; gap: 6px; }
.notes p { margin: 0; }
.ent-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 6px; }
.ent-grid button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 0; font-weight: 600; font-size: .85rem; }
.ent-grid button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.panel p.lead { color: var(--muted); margin: 0; font-size: .92rem; }
@media (max-width: 420px) { .ing-list { grid-template-columns: 1fr; } .app { padding-left: 14px; padding-right: 14px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Menús</div>
    <div class="top-actions">
      <button type="button" class="today-btn" id="hoy" hidden>Hoy</button>
      <label class="date-pill" for="fecha"><span id="fecha-txt"></span><input type="date" id="fecha" aria-label="Elegir fecha"></label>
      <button type="button" class="icon-btn" id="ajustes" aria-label="Días de entreno">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <section class="hero" id="hero" aria-live="polite"></section>

  <div class="seg" role="tablist" aria-label="Vista">
    <button type="button" role="tab" id="v-menu" aria-selected="true">Menú</button>
    <button type="button" role="tab" id="v-compra" aria-selected="false">Compra</button>
  </div>

  <div class="seg" id="weeks" role="tablist" aria-label="Semana de menú"></div>

  <main id="view"></main>
</div>

<div class="sheet" id="rec" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="rec-title">
    <button type="button" class="close" data-close aria-label="Cerrar">✕</button>
    <div id="rec-body"></div>
  </div>
</div>

<div class="sheet" id="cfg" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cfg-title">
    <button type="button" class="close" data-close aria-label="Cerrar">✕</button>
    <div class="kicker">Ajustes</div>
    <h2 id="cfg-title">Días de entreno</h2>
    <p class="lead">Marca los días que entrenas. Esos días llevan merienda pre-entreno y algo más de hidratos.</p>
    <div class="ent-grid" id="entdays"></div>
  </div>
</div>

// Desayunos (la fruta del A cambia según estación)
const DESAYUNOS = {
  A: { t: "Porridge de avena con leche, whey, fruta y nueces", i: (s) => `avn:60,lsl:200,whe:15,${s.desFruit}:100,nue:15` },
  B: { t: "Tostada de espelta con 2 huevos revueltos, queso curado y tomate", i: () => "pan:70,hue:110,que:20,tom:80,aov:5" },
  C: { t: "Tortitas de avena con leche, huevo y whey, con plátano y crema de cacahuete", i: () => "avn:50,lsl:150,hue:55,whe:15,pla:80,cac:15" },
};
const DES_ROT = ["A", "B", "A", "C", "A", "B", "C"];
const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const ENTRENO_DEF = [true, true, false, true, true, false, false];
const MER_ENT = [
  { t: "Plátano y yogur sin lactosa (60-90 min antes de entrenar)", i: "pla:110,sky:125" },
  { t: "Bocadillo pequeño de espelta con pavo y queso curado (60-90 min antes de entrenar)", i: "pan:50,fpv:40,que:15" },
];
const REST_FACTOR = 0.8; // hidratos de comida y cena en días de descanso
// Objetivo de pérdida de peso: techo diario de energía
const KCAL_MAX_ENT = 1850, KCAL_MAX_DES = 1700;
const AOV_FACTOR = 0.7; // aceite de comida y cena: 10 g -> 7 g, 5 g -> 4 g
const CITRICO = { primavera: "kiw", verano: "kiw", otono: "man", invierno: "nar" };

function parse(s) {
  return s.split(",").map((p) => { const [c, g] = p.split(":"); return [c, +g]; });
}
function dish(str) { const [t, i] = str.split("|"); return { t, items: parse(i) }; }

const PROT = ["cos","pol","mus","pav","ter","lom","jam","fpv","hig","con","sal","mer","bac","dor","lub","sar","cab","bon","atu","gam","cal","sep","mej","pul","jur","boq","tru","sca","tof"];
const LEG = ["len","gar","alu","grf"];
// Comida y cena no repiten proteína principal ni legumbre el mismo día
function clash(a, b) {
  const ca = a.items.map((i) => i[0]), cb = b.items.map((i) => i[0]);
  if (ca.some((c) => PROT.includes(c) && cb.includes(c))) return true;
  return ca.some((c) => LEG.includes(c)) && cb.some((c) => LEG.includes(c));
}

function nutrients(items) {
  const t = { kcal: 0, prot: 0, fat: 0, carb: 0, fib: 0, ca: 0, fe: 0 };
  items.forEach(([c, g]) => {
    const I = ING[c], n = NUT[c] || [0, 0, 0, 0, 0], q = g / 100;
    t.kcal += I[2] * q; t.prot += I[3] * q; t.fat += n[0] * q; t.carb += n[1] * q; t.fib += n[2] * q; t.ca += n[3] * q; t.fe += n[4] * q;
  });
  return t;
}

// Proteína por comida/cena: como máximo ~35 g (reparte mejor y evita excesos).
// Se reduce solo el alimento proteico principal, nunca por debajo del 65 %.
const MAX_P_MEAL = 35;
function capProt(o) {
  const p = o.items.reduce((s, [c, g]) => s + ING[c][3] * g / 100, 0);
  if (p <= MAX_P_MEAL) return o;
  const pMain = o.items.filter(([c]) => PROT.includes(c)).reduce((s, [c, g]) => s + ING[c][3] * g / 100, 0);
  if (!pMain) return o;
  const f = Math.max(0.65, 1 - (p - MAX_P_MEAL) / pMain);
  return { ...o, items: o.items.map(([c, g]) => [c, PROT.includes(c) && !ING[c][5] ? Math.round(g * f / 5) * 5 : g]) };
}

// Platos pequeños y con verdura: techo de energía por plato y mínimo de verdura
const MEAL_KCAL = { c: 500, n: 420 };
const VEG_MIN = 150;
function kcalOf(items) { return items.reduce((a, [c, g]) => a + ING[c][2] * g / 100, 0); }
function normalize(o, slot) {
  let items = o.items.map((x) => x.slice());
  let t = o.t;
  // 1) verdura mínima
  const veg = items.filter(([c]) => ING[c][1] === "verdura");
  const vg = veg.reduce((a, [, g]) => a + g, 0);
  if (vg < VEG_MIN) {
    if (vg > 0) items = items.map(([c, g]) => [c, ING[c][1] === "verdura" ? Math.round(g * VEG_MIN / vg / 10) * 10 : g]);
    else { items.push(["lec", 70], ["tom", 80]); t += " y ensalada"; }
  }
  // 2) techo por plato: primero hidratos (mín. 60 %), luego proteína (mín. 80 %)
  const cap = MEAL_KCAL[slot];
  let k = kcalOf(items);
  if (k > cap) {
    const ck = items.filter(([c]) => ING[c][4]).reduce((a, [c, g]) => a + ING[c][2] * g / 100, 0);
    if (ck) { const f = Math.max(0.6, 1 - (k - cap) / ck); items = items.map(([c, g]) => [c, ING[c][4] ? Math.round(g * f / 5) * 5 : g]); }
    k = kcalOf(items);
    if (k > cap) {
      const pk = items.filter(([c]) => PROT.includes(c) && !ING[c][5]).reduce((a, [c, g]) => a + ING[c][2] * g / 100, 0);
      if (pk) { const f = Math.max(0.8, 1 - (k - cap) / pk); items = items.map(([c, g]) => [c, PROT.includes(c) && !ING[c][5] ? Math.round(g * f / 5) * 5 : g]); }
    }
  }
  return { ...o, t, items };
}

// Especias recomendadas (todas las especias están permitidas; el pimiento como verdura no)
function spicesFor(o) {
  const t = o.t.toLowerCase(), has = (...cs) => o.items.some(([c]) => cs.includes(c));
  if (/arròs negre/.test(t)) return "azafrán, laurel y perejil";
  if (/arròs al forn/.test(t)) return "pimentón dulce, azafrán y romero";
  if (/paella|arròs|arroz caldoso|arroz con|fideuà/.test(t)) return "pimentón dulce, azafrán y romero";
  if (/figatell|hígado/.test(t)) return "pimienta negra, clavo y nuez moscada";
  if (/pilotes|putxero/.test(t)) return "nuez moscada, perejil, laurel y pimienta negra";
  if (/crema de calabaza|calabaza asada|puré de calabaza/.test(t)) return "nuez moscada, comino y jengibre";
  if (/borreta|giraboix/.test(t)) return "pimentón dulce, comino y laurel";
  if (has("len", "gar", "alu")) return "pimentón dulce, comino, laurel y cúrcuma";
  if (has("con")) return "romero, tomillo, laurel y una pizca de cayena";
  if (has("pol", "mus", "pav")) return "romero, tomillo, pimentón, cúrcuma o curry";
  if (has("pul")) return "pimentón dulce y picante, y sal gruesa";
  if (has("mej", "gam", "cal", "sep")) return "laurel, perejil y limón";
  if (has("sar", "cab", "bon", "jur", "boq", "sca", "sal", "atu")) return "orégano, perejil y limón";
  if (has("mer", "bac", "dor", "lub", "tru")) return "perejil, laurel, eneldo y limón";
  if (has("lom", "ter", "cos", "jam")) return "pimentón, orégano, tomillo y pimienta negra";
  if (has("hue", "cla")) return "perejil, pimentón, pimienta negra y nuez moscada";
  return "orégano, albahaca y tomillo";
}

// Índices por defecto de comida (w = 0..3). Con 21 platos, las semanas 1-3 no repiten; la 4 mezcla.
function defaultComida(w, d, N) { return w < 3 ? (d + 7 * w) % N : (d * 3 + 1) % N; }
function defaultCena(w, d, N) { return w < 3 ? (d + 7 * ((w + 1) % 3) + 2) % N : (d * 3 + 2) % N; }

// Construye el menú de una semana. opts: { ent: [7 booleanos] }
// Reglas: comida y cena sin la misma proteína ni doble legumbre; hígado máx. 1 vez/semana;
// al menos 2 días con legumbres a la semana.
function buildWeek(key, w, opts = {}) {
  const S = SEASONS[key];
  const ENT = opts.ent || ENTRENO_DEF;
  const NC = S.comidas.length, NN = S.cenas.length;
  const hasHig = (str) => /\bhig:/.test(str);
  const hasLeg = (str) => /\b(len|gar|alu|grf):/.test(str);

  // 1) Elegir platos
  const CI = [], NI = [];
  const usedC = new Set(), usedN = new Set();
  let higUsed = false;
  for (let d = 0; d < 7; d++) {
    let ci = defaultComida(w, d, NC);
    for (let j = 0; j < NC; j++) { const c = (ci + j) % NC; if (!usedC.has(c) && !(higUsed && hasHig(S.comidas[c]))) { ci = c; break; } }
    usedC.add(ci);
    const com0 = dish(S.comidas[ci]);
    let ni = defaultCena(w, d, NN);
    for (let j = 0; j < NN; j++) {
      const cand = (ni + j) % NN;
      if (!usedN.has(cand) && !clash(com0, dish(S.cenas[cand])) && !((higUsed || hasHig(S.comidas[ci])) && hasHig(S.cenas[cand]))) { ni = cand; break; }
    }
    usedN.add(ni);
    if (hasHig(S.comidas[ci]) || hasHig(S.cenas[ni])) higUsed = true;
    CI.push(ci); NI.push(ni);
  }
  // 2) Asegurar al menos 2 días con legumbres
  const legDays = () => CI.filter((c, d) => hasLeg(S.comidas[c]) || hasLeg(S.cenas[NI[d]])).length;
  // Se cambia la comida (la cena si no hay comida posible) de un día sin legumbre por otra con legumbre
  for (let d = 0; d < 7 && legDays() < 2; d++) {
    if (hasLeg(S.comidas[CI[d]]) || hasLeg(S.cenas[NI[d]])) continue;
    let done = false;
    for (let cand = 0; cand < NC && !done; cand++) {
      if (hasLeg(S.comidas[cand]) && !CI.includes(cand) && !hasHig(S.comidas[cand]) && !clash(dish(S.comidas[cand]), dish(S.cenas[NI[d]]))) { CI[d] = cand; done = true; }
    }
    for (let cand = 0; cand < NN && !done; cand++) {
      if (hasLeg(S.cenas[cand]) && !NI.includes(cand) && !hasHig(S.cenas[cand]) && !clash(dish(S.comidas[CI[d]]), dish(S.cenas[cand]))) { NI[d] = cand; done = true; }
    }
  }

  // 3) Montar los días
  const days = [];
  for (let d = 0; d < 7; d++) {
    const ent = ENT[d];
    const ci = CI[d], ni = NI[d];
    const dk = DES_ROT[(d + w * 2) % 7];
    const des = { t: DESAYUNOS[dk].t, items: parse(DESAYUNOS[dk].i(S)) };
    const [mf, mg] = S.mmFruits[(d + w) % 7];
    // Almuerzo: 4 días yogur con fruta y 3 días bocadillito valenciano
    const mm = [1, 3, 5].includes((d + w) % 7)
      ? { t: "Bocadillito de espelta con tomate rallado, queso curado y pavo", items: [["pan", 40], ["tom", 40], ["que", 20], ["fpv", 30], ["aov", 3]] }
      : { t: `Yogur o skyr sin lactosa con ${ING[mf][0].toLowerCase()}`, items: [["sky", 150], [mf, mg]] };
    let mer;
    if (ent) { const m = MER_ENT[(d + w) % 2]; mer = { t: m.t, items: parse(m.i) }; }
    else {
      const [rf, rg] = S.mmFruits[(d + w + 3) % 7];
      mer = (d + w) % 2
        ? { t: `${ING[rf][0]} y 20 g de queso curado`, items: [[rf, rg], ["que", 20]] }
        : { t: `Yogur sin lactosa con ${ING[rf][0].toLowerCase()} y 5 almendras`, items: [["sky", 125], [rf, rg], ["alm", 5]] };
    }
    const scale = (o) => ent ? o : { ...o, items: o.items.map(([c, g]) => [c, ING[c][4] ? Math.round(g * REST_FACTOR / 5) * 5 : g]) };
    // Legumbres con cítrico de postre: la vitamina C mejora la absorción del hierro
    const withCitrus = (o) => {
      if (!o.items.some(([c]) => LEG.includes(c))) return o;
      const f = CITRICO[key];
      return { ...o, t: `${o.t} + ${ING[f][0].toLowerCase()} de postre`, items: [...o.items, [f, f === "nar" ? 130 : 150]] };
    };
    const lessOil = (o) => ({ ...o, items: o.items.map(([c, g]) => [c, c === "aov" ? Math.round(g * AOV_FACTOR) : g]) });
    const com = withCitrus(scale(normalize(capProt(lessOil(dish(S.comidas[ci]))), "c")));
    const cen = withCitrus(scale(normalize(capProt(lessOil(dish(S.cenas[ni]))), "n")));
    com.spices = spicesFor(com); cen.spices = spicesFor(cen);
    const meals = [["Desayuno", des], ["Almuerzo", mm], ["Comida", com], [ent ? "Pre-entreno" : "Merienda", mer], ["Cena", cen]];
    // Control del déficit: si el día pasa del límite, se reducen los hidratos de comida y cena (mín. 60 %)
    const limit = ent ? KCAL_MAX_ENT : KCAL_MAX_DES;
    let n = nutrients(meals.flatMap(([, m]) => m.items));
    if (n.kcal > limit) {
      const carbK = [com, cen].flatMap((m) => m.items).filter(([c]) => ING[c][4]).reduce((a, [c, g]) => a + ING[c][2] * g / 100, 0);
      const f = Math.max(0.6, 1 - (n.kcal - limit) / carbK);
      [com, cen].forEach((m) => { m.items = m.items.map(([c, g]) => [c, ING[c][4] ? Math.round(g * f / 5) * 5 : g]); });
      n = nutrients(meals.flatMap(([, m]) => m.items));
    }
    days.push({ dia: DIAS[d], ent, meals, kcal: Math.round(n.kcal), prot: Math.round(n.prot), fat: Math.round(n.fat), carb: Math.round(n.carb), fib: Math.round(n.fib), ca: Math.round(n.ca), fe: +n.fe.toFixed(1) });
  }
  return days;
}

function shopping(days) {
  const tot = {};
  days.forEach((d) => d.meals.forEach(([, m]) => m.items.forEach(([c, g]) => { tot[c] = (tot[c] || 0) + g; })));
  const out = {};
  Object.entries(tot).forEach(([c, g]) => {
    const [n, cat, , , , u] = ING[c];
    let q;
    if (u) { const k = Math.ceil(g / u[1]); q = `${k} ${k === 1 ? { latas: "lata", uds: "ud" }[u[0]] : u[0]}`; }
    else if (g >= 1000) q = `${(Math.ceil(g / 100) / 10).toString().replace(".", ",")} kg`;
    else q = `${Math.ceil(g / 10) * 10} g`;
    (out[cat] = out[cat] || []).push([n, q]);
  });
  return out;
}

const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

function seasonKey(date) {
  const y = date.getFullYear();
  const t = (m, d) => new Date(y, m - 1, d);
  if (date >= t(12, 21)) return "invierno";
  if (date >= t(9, 23)) return "otono";
  if (date >= t(6, 21)) return "verano";
  if (date >= t(3, 20)) return "primavera";
  return "invierno";
}

// Semanas de lunes a domingo. Cada semana pertenece al mes en el que cae su lunes:
// el 1.er lunes del mes abre la semana 1. Si el mes tiene 5 lunes, la semana 5 repite el menú 1.
// La estación se decide por el lunes, para que toda la semana use el mismo menú.
function seasonOf(date) {
  const dow = (date.getDay() + 6) % 7;
  const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate() - dow);
  const n = Math.ceil(monday.getDate() / 7);
  return { key: seasonKey(monday), week: n === 5 ? 1 : n - 1, n, month: MESES[monday.getMonth()], monday, dow };
}

if (typeof module !== "undefined") module.exports = { ING, NUT, SEASONS, buildWeek, shopping, seasonOf };

// ---------------- Generador para platos a la plancha / al horno ----------------
const PESC_BL = ["mer", "bac", "dor", "lub", "tru"], PESC_AZ = ["sar", "cab", "bon", "jur", "boq", "sal"], MARISCO = ["gam", "cal", "sep"];
const NOMBRES = {
  mer: ["la merluza", "f"], bac: ["el bacalao", "m"], dor: ["la dorada", "f"], lub: ["la lubina", "f"], tru: ["la trucha", "f"],
  sar: ["las sardinas", "fp"], cab: ["la caballa", "f"], bon: ["el bonito", "m"], jur: ["el sorell (jurel)", "m"], boq: ["los boquerones", "mp"], sal: ["el salmón", "m"],
  gam: ["las gambas", "fp"], cal: ["los calamares", "mp"], sep: ["la sepia", "f"],
  pol: ["la pechuga de pollo", "f"], pav: ["la pechuga de pavo", "f"], mus: ["el muslo de pollo", "m"], lom: ["el lomo", "m"],
};
const yList = (a) => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " y " + a[a.length - 1];
function genReceta(t, items) {
  const has = (c) => items.some(([x]) => x === c);
  const tl = t.toLowerCase();
  const horno = /al horno|papillote/.test(tl);
  const pasos = [];
  const notas = [];
  // Guarniciones que tardan más: primero
  if (has("pat")) {
    if (/puré/.test(tl)) pasos.push("Cuece la patata en trozos 20 minutos, escúrrela y cháfala con un poco de aceite y sal.");
    else if (horno || /patatas? al horno|asada/.test(tl)) pasos.push("Precalienta el horno a 200 °C. Corta la patata en rodajas finas, alíñala con unas gotas de aceite y sal, y hornéala 25-30 minutos.");
    else if (/ensalada de patata/.test(tl)) pasos.push("Cuece la patata con piel 20-25 minutos, enfríala, pélala y trocéala.");
    else pasos.push("Cuece la patata en trozos en agua con sal y una hoja de laurel 15-20 minutos.");
  }
  if (has("arr")) { pasos.push("Hierve el arroz integral en agua con sal 35 minutos y escúrrelo."); notas.push(NOTA_INTEGRAL); }
  if (has("cza")) pasos.push(/puré/.test(tl) ? "Cuece la calabaza en trozos 15-20 minutos y cháfala con nuez moscada." : "Corta la calabaza en dados y ásala en el horno a 200 °C 25 minutos con unas gotas de aceite, sal y comino.");
  if (has("ber")) pasos.push("Corta la berenjena en rodajas y ásala a la plancha o en el horno 15-20 minutos con sal y orégano.");
  if (has("nab")) pasos.push("Cuece el nabo pelado en dados 12-15 minutos en agua con sal (o ásalo junto al pescado).");
  // Proteína
  const P = items.find(([c]) => PROT.includes(c));
  const pc = P ? P[0] : null;
  if (pc) {
    const [n, g] = NOMBRES[pc] || [ING[pc][0].toLowerCase(), "m"];
    const lo = { m: "lo", f: "la", mp: "los", fp: "las" }[g];
    const fin = { m: "o", f: "a", mp: "os", fp: "as" }[g];
    if (horno && (PESC_BL.includes(pc) || PESC_AZ.includes(pc)))
      pasos.push(`Coloca ${n} en una fuente${has("pat") ? " sobre la patata" : ""}${has("tom") ? " con el tomate en rodajas" : ""}, con sal, las especias, un chorrito de limón y un poco de aceite. Hornea a 200 °C 15-20 minutos${/papillote/.test(tl) ? ", envuelto en papel de horno" : ""}.`);
    else if (PESC_BL.includes(pc) || ["bon", "cab", "jur", "sal"].includes(pc))
      pasos.push(`Seca ${n} con papel de cocina, sala y haz${lo} a la plancha bien caliente con unas gotas de aceite, 3-4 minutos por lado según el grosor.`);
    else if (["sar", "boq"].includes(pc)) pasos.push(`Limpia ${n}, sala con sal gruesa y haz${lo} a la plancha bien caliente 2 minutos por lado.`);
    else if (MARISCO.includes(pc)) pasos.push(`Limpia ${n}${pc === "gam" ? "" : " y trocéa" + lo}. Haz${lo} a la plancha muy caliente con unas gotas de aceite ${pc === "gam" ? "1-2 minutos por lado" : "3-4 minutos, hasta que esté" + (g.endsWith("p") ? "n" : "") + " dorad" + fin}. Termina con perejil y limón.`);
    else if (pc === "hig") pasos.push("Limpia el hígado de nervios, sálalo y hazlo a la plancha 2-3 minutos por lado, hasta que no quede rosado por dentro.");
    else if (pc === "con") pasos.push("Sala el conejo troceado y hazlo a la plancha o en la sartén con romero y tomillo 15-20 minutos, dándole vueltas, hasta que esté dorado y hecho.");
    else if (["pol", "pav", "mus"].includes(pc)) pasos.push(`Sala ${n} y haz${lo} a la plancha con unas gotas de aceite y las especias, 4-5 minutos por lado, hasta que no quede rosad${fin}${/limón/.test(tl) ? ". Al final, añade el zumo de medio limón" : ""}.`);
    else if (pc === "lom") pasos.push("Sala el lomo y hazlo a la plancha con pimentón, orégano y pimienta, 3-4 minutos por lado.");
    else pasos.push(`Cocina ${n} a la plancha con sal y unas gotas de aceite.`);
  }
  // Verdura y acompañamientos rápidos
  if (has("cbc") && !has("ber")) pasos.push(/vapor/.test(tl) ? "Cuece al vapor el calabacín y la zanahoria 8-10 minutos." : "Corta el calabacín en rodajas o dados y hazlo a la plancha o salteado 5-6 minutos con sal.");
  else if (has("zan") && /vapor/.test(tl)) pasos.push("Cuece la zanahoria al vapor 8-10 minutos.");
  if (has("ace")) pasos.push("Cuece las acelgas troceadas 8 minutos (o rehógalas con el aceite de ajo) y escúrrelas.");
  if (has("esp")) pasos.push("Saltea las espinacas 2-3 minutos con unas gotas de aceite (puede ser aceite de ajo).");
  if (has("end")) pasos.push("Corta las endibias por la mitad y márcalas a la plancha 2 minutos, o sírvelas crudas en hojas aliñadas.");
  if (has("jud")) pasos.push("Cuece la bajoqueta (judía verde) troceada 8-10 minutos en agua con sal.");
  if (has("lec") || /ensalada/.test(tl)) pasos.push(`Prepara la ensalada con ${yList(["lechuga", has("tom") && "tomate", has("pep") && "pepino", has("oli") && "aceitunas"].filter(Boolean))}, y alíñala con aceite, sal y vinagre o limón.`);
  else if (has("tom") && !horno) pasos.push("Corta el tomate en rodajas y alíñalo con sal, aceite y orégano.");
  if (has("pep") && !has("lec") && !/ensalada/.test(tl)) pasos.push("Corta el pepino en rodajas y añádelo al tomate.");
  if (has("pan")) pasos.push("Tuesta el pan.");
  pasos.push("Aliña el plato con el aceite que quede, las especias recomendadas y unas gotas de limón.");
  if (/ajillo|aceite de ajo/.test(tl)) notas.unshift(NOTA_AJO);
  const tiempo = has("pat") && (horno || /asada|al horno/.test(tl)) || has("arr") || has("cza") ? "40 min" : has("pat") ? "30 min" : "20 min";
  return { tiempo, pasos, notas };
}

function recetaDe(meal, slot) {
  const base = meal.t.replace(/ \+ .* de postre$/, "");
  let r = null;
  for (const [re, fn] of RECETAS) { if (re.test(base)) { if (fn) r = fn(base); break; } }
  if (!r) r = genReceta(base, meal.items);
  const notas = [...(r.notas || [])];
  if (/de postre$/.test(meal.t)) notas.push("De postre, la fruta cítrica: su vitamina C ayuda a absorber el hierro de la legumbre.");
  if (slot === "c" && !notas.includes(NOTA_TAPER)) notas.push(NOTA_TAPER);
  return { titulo: base, tiempo: r.tiempo, pasos: r.pasos, notas };
}

if (typeof module !== "undefined") module.exports = { recetaDe, RECETAS };

};
const DCORTO = ["Lu", "Ma", "Mi", "Ju", "Vi", "Sá", "Do"];

function toInput(d) { const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function fromInput(v) { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function ingParts(c, g) {
  const [n, , , , , u] = ING[c];
  let q;
  if (u) { const k = Math.max(1, Math.round(g / u[1])); q = `${k} ${k === 1 ? { latas: "lata", uds: "ud" }[u[0]] : u[0]}`; } else q = `${g} g`;
  return [n.replace(/ \(.*\)/, ""), q];
}
const ingLine = (items) => items.map(([c, g]) => { const [n, q] = ingParts(c, g); return `${n.toLowerCase()} ${q}`; }).join(" · ");
const sameDay = (a, b) => a.toDateString() === b.toDateString();

function setDate(d) {
  const s = seasonOf(d);
  state = { date: d, key: s.key, week: s.week, currentWeek: s.week, dow: s.dow, n: s.n, month: s.month, monday: s.monday, sel: s.dow };
  document.documentElement.dataset.season = s.key;
  $("fecha").value = toInput(d);
  $("fecha-txt").textContent = d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
  $("hoy").hidden = sameDay(d, new Date());
  render();
}

function render() {

    <p>${S.note}</p>`;
  $("weeks").innerHTML = [0, 1, 2, 3].map((w) => `<button type="button" role="tab" aria-selected="${w === state.week}" data-w="${w}">Semana ${w + 1}${w === state.currentWeek ? '<span class="dot" aria-label="(te toca)"></span>' : ""}</button>`).join("");
  $("weeks").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { state.week = +b.dataset.w; if (state.week !== state.currentWeek) state.sel = 0; else state.sel = state.dow; render(); }));
  $("v-menu").setAttribute("aria-selected", view === "menu");
  $("v-compra").setAttribute("aria-selected", view === "compra");

  const days = buildWeek(state.key, state.week, { ent });

  monday.setDate(monday.getDate() + 7 * (state.week - state.currentWeek));

  $("view").innerHTML = `
    <nav class="days" role="tablist" aria-label="Día">${days.map((x, i) => {
      const dd = new Date(monday); dd.setDate(monday.getDate() + i);
      return `<button type="button" class="day-btn${isCur && i === state.dow && sameDay(state.date, new Date()) ? " is-today" : ""}" role="tab" aria-selected="${i === state.sel}" data-i="${i}" aria-label="${x.dia}${x.ent ? ", entreno" : ""}">
        <span class="d">${DCORTO[i]}</span>${isCur ? `<span class="n">${dd.getDate()}</span>` : ""}<span class="tr${x.ent ? " on" : ""}"></span></button>`;
    }).join("")}</nav>
    <div style="height:14px"></div>
    <div class="day-head">
      <h2>${d.dia}${isCur ? ` <span style="color:var(--muted);font-size:1rem">${dayDate.getDate()} de ${MESES[dayDate.getMonth()]}</span>` : ""}<span class="tag${d.ent ? "" : " rest"}">${d.ent ? "Entreno" : "Descanso"}</span></h2>
      <div class="meta">${d.kcal.toLocaleString("es-ES")} kcal · ${d.prot} g proteína</div>
    </div>
    <div style="height:12px"></div>
    <div class="meals">${d.meals.map(([lbl, m], j) => {
      const rec = [0, 2, 4].includes(j);
      const tag = rec ? "button" : "div";
      return `<${tag} ${rec ? `type="button" data-j="${j}" aria-label="${esc(lbl)}: ${esc(m.t)}. Ver receta"` : ""} class="meal">
        <div class="row"><span class="lbl">${lbl}</span>${rec ? '<span class="go">Receta <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>' : ""}</div>
        <div class="t">${esc(m.t)}</div>
        <div class="ing">${esc(ingLine(m.items))}</div>
      </${tag}>`;
    }).join("")}</div>`;
  $("view").querySelectorAll(".day-btn").forEach((b) => b.addEventListener("click", () => { state.sel = +b.dataset.i; render(); }));
  $("view").querySelectorAll("button.meal").forEach((b) => b.addEventListener("click", () => openRecipe(+b.dataset.j, b)));
}

  const list = shopping(days);
  const sk = `shop-${state.key}-${state.week}`;
  const checked = store.get(sk) || {};
  const order = ["carne", "pescado", "huevos", "lacteos", "cereal", "legumbre", "verdura", "fruta", "grasa", "suple"];
  let html = `<section class="shop"><h2>Lista de la compra</h2><div class="sub">${S.name} · semana ${state.week + 1} · para 7 días</div>`;
  order.forEach((cat) => {
    if (!list[cat]) return;
    html += `<h3>${CATS[cat]}</h3><ul>` + list[cat].sort((a, b) => a[0].localeCompare(b[0], "es")).map(([n, q], j) => {
      const id = `c-${cat}-${j}`;
      return `<li><label for="${id}"><input type="checkbox" id="${id}" data-n="${esc(n)}" ${checked[n] ? "checked" : ""}><span>${esc(n.replace(/ \(.*\)/, ""))}</span><span class="q">${q}</span></label></li>`;
    }).join("") + "</ul>";
  });
  html += `<div class="actions"><button class="btn primary" id="copy" type="button">Copiar lista</button><button class="btn" id="clear" type="button">Desmarcar todo</button></div><div class="toast" id="toast" role="status"></div></section>`;
  $("view").innerHTML = html;
  $("view").querySelectorAll("input[type=checkbox]").forEach((cb) => cb.addEventListener("change", () => {
    const c = store.get(sk) || {}; c[cb.dataset.n] = cb.checked; store.set(sk, c);
  }));
  $("clear").addEventListener("click", () => { store.set(sk, {}); renderShop(days); });
  $("copy").addEventListener("click", async () => {
    const txt = `Compra · ${S.name}, semana ${state.week + 1}\n` + order.filter((c) => list[c]).map((c) => `\n${CATS[c]}\n` + list[c].map(([n, q]) => `- ${n}: ${q}`).join("\n")).join("\n");
    try { await navigator.clipboard.writeText(txt); $("toast").textContent = "Lista copiada."; }
    catch (e) { $("toast").textContent = "No se ha podido copiar en este navegador."; }
  });
}

// ---- Hojas
let lastFocus = null;
function openSheet(id, from) { lastFocus = from || null; $(id).hidden = false; document.body.style.overflow = "hidden"; $(id).querySelector("[data-close]").focus(); }
function closeSheet(id) { $(id).hidden = true; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }
["rec", "cfg"].forEach((id) => {
  $(id).addEventListener("click", (e) => { if (e.target.id === id || e.target.closest("[data-close]")) closeSheet(id); });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") ["rec", "cfg"].forEach((id) => { if (!$(id).hidden) closeSheet(id); }); });

function openRecipe(j, btn) {
  const day = state.days[state.sel];
  const [lbl, m] = day.meals[j];
  const r = recetaDe(m, j === 2 ? "c" : j === 4 ? "n" : "d");
  $("rec-body").innerHTML = `
    <div class="kicker">${day.dia} · ${lbl}</div>
    <h2 id="rec-title">${esc(r.titulo)}</h2>
    <div class="chips-row"><span class="chip">${esc(r.tiempo)}</span>${m.spices ? `<span class="chip">${esc(m.spices)}</span>` : ""}</div>
    <h3>Tu ración</h3>
    <ul class="ing-list">${m.items.map(([c, g]) => { const [n, q] = ingParts(c, g); return `<li><span>${esc(n)}</span><span>${q}</span></li>`; }).join("")}</ul>
    <p class="hint">Para más personas, multiplica las cantidades.</p>
    <h3>Preparación</h3>
    <ol class="steps">${r.pasos.map((p) => `<li><span>${esc(p)}</span></li>`).join("")}</ol>
    ${r.notas.length ? `<div class="notes">${r.notas.map((n) => `<p>${esc(n)}</p>`).join("")}</div>` : ""}`;
  $("rec").querySelector(".panel").scrollTop = 0;
  openSheet("rec", btn);
}

function renderEnt() {
  $("entdays").innerHTML = DCORTO.map((n, i) => `<button type="button" aria-pressed="${ent[i]}" data-i="${i}" aria-label="${DIAS[i]}">${n}</button>`).join("");
  $("entdays").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { ent[+b.dataset.i] = !ent[+b.dataset.i]; store.set("ent", ent); renderEnt(); render(); }));
}

$("v-menu").addEventListener("click", () => { view = "menu"; render(); });
$("v-compra").addEventListener("click", () => { view = "compra"; render(); });
$("fecha").addEventListener("change", (e) => { if (e.target.value) setDate(fromInput(e.target.value)); });
$("hoy").addEventListener("click", () => setDate(new Date()));
$("ajustes").addEventListener("click", (e) => { renderEnt(); openSheet("cfg", e.currentTarget); });
setDate(new Date());
</script>
