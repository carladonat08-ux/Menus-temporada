<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menús de temporada</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Menús">
<meta name="application-name" content="Menús">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Una columna tipo app: estación arriba, días en fila, un día a la vista; compra en su propia pestaña */
  --bg: #f6f5f1;
  --surface: #ffffff;
  --ink: #1c211e;
  --muted: #6b726e;
  --line: #e6e7e2;
  --accent: #3f7d4e;
  --accent-soft: #e6f0e7;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(28, 33, 30, .04), 0 6px 20px rgba(28, 33, 30, .05);
  color-scheme: light;
}
:root[data-season="primavera"] { --accent: #3f7d4e; --accent-soft: #e6f0e7; }
:root[data-season="verano"] { --accent: #bf4f2e; --accent-soft: #f8e7df; }
:root[data-season="otono"] { --accent: #a3620f; --accent-soft: #f4eadb; }
:root[data-season="invierno"] { --accent: #2f6390; --accent-soft: #e3ebf3; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121614; --surface: #1b201d; --ink: #ecefec; --muted: #9ea7a2; --line: #2b322e; --shadow: none; color-scheme: dark; }
  :root:not([data-theme="light"])[data-season="primavera"] { --accent: #86c595; --accent-soft: #213428; }
  :root:not([data-theme="light"])[data-season="verano"] { --accent: #f0936f; --accent-soft: #3d251d; }
  :root:not([data-theme="light"])[data-season="otono"] { --accent: #e4ab5a; --accent-soft: #3a2c1b; }
  :root:not([data-theme="light"])[data-season="invierno"] { --accent: #86b6e2; --accent-soft: #1d2e40; }
}
:root[data-theme="dark"] { --bg: #121614; --surface: #1b201d; --ink: #ecefec; --muted: #9ea7a2; --line: #2b322e; --shadow: none; color-scheme: dark; }
:root[data-theme="dark"][data-season="primavera"] { --accent: #86c595; --accent-soft: #213428; }
:root[data-theme="dark"][data-season="verano"] { --accent: #f0936f; --accent-soft: #3d251d; }
:root[data-theme="dark"][data-season="otono"] { --accent: #e4ab5a; --accent-soft: #3a2c1b; }
:root[data-theme="dark"][data-season="invierno"] { --accent: #86b6e2; --accent-soft: #1d2e40; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 720px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 18px; }

/* Cabecera */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--display); font-weight: 600; font-size: 1.15rem; letter-spacing: -.01em; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.date-pill { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .88rem; font-weight: 500; }
.date-pill input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.icon-btn svg { width: 18px; height: 18px; }
.today-btn { padding: 7px 12px; border-radius: 999px; background: var(--accent); color: var(--surface); border: 0; font-size: .85rem; font-weight: 600; }
.today-btn[hidden] { display: none; }

/* Estación */
.hero { padding: 4px 2px 0; }
.hero .kicker { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 9vw, 3.2rem); line-height: 1; margin: 6px 0 8px; letter-spacing: -.02em; }
.hero p { margin: 0; color: var(--muted); max-width: 52ch; font-size: .95rem; }

/* Controles */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 8px 6px; font-weight: 600; font-size: .9rem; color: var(--muted); position: relative; white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
.seg .dot { position: absolute; top: 3px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.seg button[aria-selected="true"] .dot { background: var(--surface); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-btn { border: 1px solid transparent; background: transparent; border-radius: 14px; padding: 8px 0 7px; display: grid; justify-items: center; gap: 3px; color: var(--muted); }
.day-btn .d { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.day-btn .n { font-family: var(--display); font-size: 1.25rem; color: var(--ink); line-height: 1.1; }
.day-btn .tr { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.day-btn .tr.on { background: var(--accent); }
.day-btn[aria-selected="true"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); color: var(--accent); }
.day-btn.is-today .n { color: var(--accent); }

/* Día */
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 0 2px; }
.day-head h2 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: -.01em; }
.day-head .meta { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-family: var(--body); font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 8px; vertical-align: middle; }
.tag.rest { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.meals { display: grid; gap: 10px; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 4px; text-align: left; width: 100%; }
button.meal { cursor: pointer; transition: border-color .15s; }
button.meal:hover { border-color: var(--accent); }
.meal .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.meal .lbl { font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.meal .go { font-size: .78rem; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.meal .t { font-family: var(--display); font-size: 1.12rem; line-height: 1.25; font-weight: 400; }
.meal .ing { font-size: .86rem; color: var(--muted); line-height: 1.4; }

/* Compra */
.shop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.shop h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; }
.shop .sub { color: var(--muted); font-size: .88rem; margin-top: 2px; }
.shop h3 { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin: 18px 0 6px; }
.shop ul { list-style: none; padding: 0; margin: 0; }
.shop li { border-bottom: 1px solid var(--line); }
.shop li:last-child { border-bottom: 0; }
.shop label { display: flex; gap: 12px; align-items: center; padding: 9px 0; cursor: pointer; font-size: .95rem; }
.shop input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.shop .q { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .9rem; }
.shop input:checked ~ span { color: var(--muted); text-decoration: line-through; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.btn { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .9rem; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.toast { font-size: .85rem; color: var(--accent); min-height: 1.2em; margin-top: 8px; }

/* Hojas (receta y ajustes) */
.sheet { position: fixed; inset: 0; background: rgba(15, 18, 16, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet[hidden] { display: none; }
.panel { position: relative; background: var(--surface); width: min(680px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 12px 22px calc(28px + env(safe-area-inset-bottom)); }
.panel::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
@media (min-width: 760px) { .sheet { align-items: center; padding: 24px; } .panel { border-radius: 22px; max-height: 88vh; padding-top: 22px; } .panel::before { display: none; } }
.close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--bg); font-size: .95rem; }
.panel .kicker { font-size: .75rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; line-height: 1.15; margin: 6px 44px 10px 0; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.panel h3 { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 22px 0 8px; }
.ing-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.ing-list li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.ing-list li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hint { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 14px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; line-height: 1.5; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .85rem; display: grid; place-items: center; }
.notes { margin-top: 20px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: .86rem; display: grid; gap: 6px; }
.notes p { margin: 0; }
.ent-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 6px; }
.ent-grid button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 0; font-weight: 600; font-size: .85rem; }
.ent-grid button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.panel p.lead { color: var(--muted); margin: 0; font-size: .92rem; }
@media (max-width: 420px) { .ing-list { grid-template-columns: 1fr; } .app { padding-left: 14px; padding-right: 14px; } }
.app > * { min-width: 0; }
.top { min-width: 0; }
.top-actions { min-width: 0; }
@media (max-width: 360px) {
  .brand { font-size: 1rem; }
  .top-actions { gap: 6px; }
  .date-pill { padding: 6px 9px; font-size: .8rem; }
  .icon-btn { width: 34px; height: 34px; }
  .today-btn { padding: 6px 9px; font-size: .78rem; }
  .seg button { font-size: .8rem; padding: 8px 2px; }
  .hero h1 { font-size: 2.2rem; }
  .day-btn .n { font-size: 1.1rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Menús</div>
    <div class="top-actions">
      <button type="button" class="today-btn" id="hoy" hidden>Hoy</button>
      <label class="date-pill" for="fecha"><span id="fecha-txt"></span><input type="date" id="fecha" aria-label="Elegir fecha"></label>
      <button type="button" class="icon-btn" id="ajustes" aria-label="Días de entreno">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <section class="hero" id="hero" aria-live="polite"></section>

  <div class="seg" role="tablist" aria-label="Vista">
    <button type="button" role="tab" id="v-menu" aria-selected="true">Menú</button>
    <button type="button" role="tab" id="v-compra" aria-selected="false">Compra</button>
  </div>

  <div class="seg" id="weeks" role="tablist" aria-label="Semana de menú"></div>

  <main id="view"></main>
</div>

<div class="sheet" id="rec" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="rec-title">
    <button type="button" class="close" data-close aria-label="Cerrar">✕</button>
    <div id="rec-body"></div>
  </div>
</div>

<div class="sheet" id="cfg" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cfg-title">
    <button type="button" class="close" data-close aria-label="Cerrar">✕</button>
    <div class="kicker">Ajustes</div>
    <h2 id="cfg-title">Días de entreno</h2>
    <p class="lead">Marca los días que entrenas. Esos días llevan merienda pre-entreno y algo más de hidratos.</p>
    <div class="ent-grid" id="entdays"></div>
  </div>
</div>

<script>
/*DATA*/

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const DCORTO = ["Lu", "Ma", "Mi", "Ju", "Vi", "Sá", "Do"];
let ent = store.get("ent") || ENTRENO_DEF.slice();
let state = {};
let view = "menu";

function toInput(d) { const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function fromInput(v) { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function ingParts(c, g) {
  const [n, , , , , u] = ING[c];
  let q;
  if (u) { const k = Math.max(1, Math.round(g / u[1])); q = `${k} ${k === 1 ? { latas: "lata", uds: "ud" }[u[0]] : u[0]}`; } else q = `${g} g`;
  return [n.replace(/ \(.*\)/, ""), q];
}
const ingLine = (items) => items.map(([c, g]) => { const [n, q] = ingParts(c, g); return `${n.toLowerCase()} ${q}`; }).join(" · ");
const sameDay = (a, b) => a.toDateString() === b.toDateString();

function setDate(d) {
  const s = seasonOf(d);
  state = { date: d, key: s.key, week: s.week, currentWeek: s.week, dow: s.dow, n: s.n, month: s.month, monday: s.monday, sel: s.dow };
  document.documentElement.dataset.season = s.key;
  $("fecha").value = toInput(d);
  $("fecha-txt").textContent = d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
  $("hoy").hidden = sameDay(d, new Date());
  render();
}

function render() {
  const S = SEASONS[state.key];
  $("hero").innerHTML = `
    <div class="kicker">Semana ${state.n} de ${state.month}${state.n === 5 ? " · menú 2" : ""}</div>
    <h1>${S.name}</h1>
    <p>${S.note}</p>`;
  $("weeks").innerHTML = [0, 1, 2, 3].map((w) => `<button type="button" role="tab" aria-selected="${w === state.week}" data-w="${w}">Semana ${w + 1}${w === state.currentWeek ? '<span class="dot" aria-label="(te toca)"></span>' : ""}</button>`).join("");
  $("weeks").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { state.week = +b.dataset.w; if (state.week !== state.currentWeek) state.sel = 0; else state.sel = state.dow; render(); }));
  $("v-menu").setAttribute("aria-selected", view === "menu");
  $("v-compra").setAttribute("aria-selected", view === "compra");

  const days = buildWeek(state.key, state.week, { ent });
  state.days = days;
  if (view === "compra") return renderShop(days);

  const monday = new Date(state.monday);
  monday.setDate(monday.getDate() + 7 * (state.week - state.currentWeek));
  const isCur = state.week === state.currentWeek;
  const d = days[state.sel];
  const dayDate = new Date(monday); dayDate.setDate(monday.getDate() + state.sel);
  $("view").innerHTML = `
    <nav class="days" role="tablist" aria-label="Día">${days.map((x, i) => {
      const dd = new Date(monday); dd.setDate(monday.getDate() + i);
      return `<button type="button" class="day-btn${isCur && i === state.dow && sameDay(state.date, new Date()) ? " is-today" : ""}" role="tab" aria-selected="${i === state.sel}" data-i="${i}" aria-label="${x.dia}${x.ent ? ", entreno" : ""}">
        <span class="d">${DCORTO[i]}</span>${isCur ? `<span class="n">${dd.getDate()}</span>` : ""}<span class="tr${x.ent ? " on" : ""}"></span></button>`;
    }).join("")}</nav>
    <div style="height:14px"></div>
    <div class="day-head">
      <h2>${d.dia}${isCur ? ` <span style="color:var(--muted);font-size:1rem">${dayDate.getDate()} de ${MESES[dayDate.getMonth()]}</span>` : ""}<span class="tag${d.ent ? "" : " rest"}">${d.ent ? "Entreno" : "Descanso"}</span></h2>
      <div class="meta">${d.kcal.toLocaleString("es-ES")} kcal · ${d.prot} g proteína</div>
    </div>
    <div style="height:12px"></div>
    <div class="meals">${d.meals.map(([lbl, m], j) => {
      const rec = [0, 2, 4].includes(j) && !m.noRecipe;
      const tag = rec ? "button" : "div";
      return `<${tag} ${rec ? `type="button" data-j="${j}" aria-label="${esc(lbl)}: ${esc(m.t)}. Ver receta"` : ""} class="meal">
        <div class="row"><span class="lbl">${lbl}</span>${rec ? '<span class="go">Receta <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>' : ""}</div>
        <div class="t">${esc(m.t)}</div>
        <div class="ing">${esc(ingLine(m.items))}</div>
      </${tag}>`;
    }).join("")}</div>`;
  $("view").querySelectorAll(".day-btn").forEach((b) => b.addEventListener("click", () => { state.sel = +b.dataset.i; render(); }));
  $("view").querySelectorAll("button.meal").forEach((b) => b.addEventListener("click", () => openRecipe(+b.dataset.j, b)));
}

function renderShop(days) {
  const S = SEASONS[state.key];
  const list = shopping(days);
  const sk = `shop-${state.key}-${state.week}`;
  const checked = store.get(sk) || {};
  const order = ["carne", "pescado", "huevos", "lacteos", "cereal", "legumbre", "verdura", "fruta", "grasa", "suple"];
  let html = `<section class="shop"><h2>Lista de la compra</h2><div class="sub">${S.name} · semana ${state.week + 1} · para 7 días</div>`;
  order.forEach((cat) => {
    if (!list[cat]) return;
    html += `<h3>${CATS[cat]}</h3><ul>` + list[cat].sort((a, b) => a[0].localeCompare(b[0], "es")).map(([n, q], j) => {
      const id = `c-${cat}-${j}`;
      return `<li><label for="${id}"><input type="checkbox" id="${id}" data-n="${esc(n)}" ${checked[n] ? "checked" : ""}><span>${esc(n.replace(/ \(.*\)/, ""))}</span><span class="q">${q}</span></label></li>`;
    }).join("") + "</ul>";
  });
  html += `<div class="actions"><button class="btn primary" id="copy" type="button">Copiar lista</button><button class="btn" id="clear" type="button">Desmarcar todo</button></div><div class="toast" id="toast" role="status"></div></section>`;
  $("view").innerHTML = html;
  $("view").querySelectorAll("input[type=checkbox]").forEach((cb) => cb.addEventListener("change", () => {
    const c = store.get(sk) || {}; c[cb.dataset.n] = cb.checked; store.set(sk, c);
  }));
  $("clear").addEventListener("click", () => { store.set(sk, {}); renderShop(days); });
  $("copy").addEventListener("click", async () => {
    const txt = `Compra · ${S.name}, semana ${state.week + 1}\n` + order.filter((c) => list[c]).map((c) => `\n${CATS[c]}\n` + list[c].map(([n, q]) => `- ${n}: ${q}`).join("\n")).join("\n");
    try { await navigator.clipboard.writeText(txt); $("toast").textContent = "Lista copiada."; }
    catch (e) { $("toast").textContent = "No se ha podido copiar en este navegador."; }
  });
}

// ---- Hojas
let lastFocus = null;
function openSheet(id, from) { lastFocus = from || null; $(id).hidden = false; document.body.style.overflow = "hidden"; $(id).querySelector("[data-close]").focus(); }
function closeSheet(id) { $(id).hidden = true; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }
["rec", "cfg"].forEach((id) => {
  $(id).addEventListener("click", (e) => { if (e.target.id === id || e.target.closest("[data-close]")) closeSheet(id); });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") ["rec", "cfg"].forEach((id) => { if (!$(id).hidden) closeSheet(id); }); });

function openRecipe(j, btn) {
  const day = state.days[state.sel];
  const [lbl, m] = day.meals[j];
  const r = recetaDe(m, j === 2 ? "c" : j === 4 ? "n" : "d");
  $("rec-body").innerHTML = `
    <div class="kicker">${day.dia} · ${lbl}</div>
    <h2 id="rec-title">${esc(r.titulo)}</h2>
    <div class="chips-row"><span class="chip">${esc(r.tiempo)}</span>${m.spices ? `<span class="chip">${esc(m.spices)}</span>` : ""}</div>
    <h3>Tu ración</h3>
    <ul class="ing-list">${m.items.map(([c, g]) => { const [n, q] = ingParts(c, g); return `<li><span>${esc(n)}</span><span>${q}</span></li>`; }).join("")}</ul>
    <p class="hint">Para más personas, multiplica las cantidades.</p>
    <h3>Preparación</h3>
    <ol class="steps">${r.pasos.map((p) => `<li><span>${esc(p)}</span></li>`).join("")}</ol>
    ${r.notas.length ? `<div class="notes">${r.notas.map((n) => `<p>${esc(n)}</p>`).join("")}</div>` : ""}`;
  $("rec").querySelector(".panel").scrollTop = 0;
  openSheet("rec", btn);
}

function renderEnt() {
  $("entdays").innerHTML = DCORTO.map((n, i) => `<button type="button" aria-pressed="${ent[i]}" data-i="${i}" aria-label="${DIAS[i]}">${n}</button>`).join("");
  $("entdays").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { ent[+b.dataset.i] = !ent[+b.dataset.i]; store.set("ent", ent); renderEnt(); render(); }));
}

$("v-menu").addEventListener("click", () => { view = "menu"; render(); });
$("v-compra").addEventListener("click", () => { view = "compra"; render(); });
$("fecha").addEventListener("change", (e) => { if (e.target.value) setDate(fromInput(e.target.value)); });
$("hoy").addEventListener("click", () => setDate(new Date()));
$("ajustes").addEventListener("click", (e) => { renderEnt(); openSheet("cfg", e.currentTarget); });
setDate(new Date());
</script>
</body>
