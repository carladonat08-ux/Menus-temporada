    <circle cx="256" cy="256" r="172" stroke="#5fae72" stroke-dasharray="226 855" transform="rotate(8 256 256)"/>
    <circle cx="256" cy="256" r="172" stroke="#ee7a52" stroke-dasharray="226 855" transform="rotate(98 256 256)"/>
    <circle cx="256" cy="256" r="172" stroke="#e0a03e" stroke-dasharray="226 855" transform="rotate(188 256 256)"/>
    <circle cx="256" cy="256" r="172" stroke="#5d9ad0" stroke-dasharray="226 855" transform="rotate(278 256 256)"/>
  </g>
  <!-- plato -->
